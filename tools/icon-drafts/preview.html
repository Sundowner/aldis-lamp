<!doctype html><html><head><meta charset="utf-8"><title>Aldis Lamp - icon drafts</title>
<style>body{background:#14171a;color:#d6d9de;font:14px/1.45 "Segoe UI",sans-serif;margin:24px}
h1{font-size:19px;margin:0 0 4px}p{color:#9aa3ad;margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(1,minmax(0,1fr));gap:18px}
.cell{text-align:center}.tile{background:#282b30;border-radius:14px;padding:8px;display:inline-block;position:relative}
.tile img{width:158px;height:158px;display:block}
.ttl{position:absolute;left:12px;right:12px;bottom:12px;text-align:center;color:#f5f5f5;font-size:18px;font-weight:600;line-height:1.1}
.cap{margin-top:8px;font-weight:600}
.sub{color:#8f98a3;font-size:12px}h2{font-size:14px;margin:26px 0 10px;color:#9aa3ad;font-weight:600}
</style></head><body><h1>Aldis Lamp &mdash; key icon drafts</h1>
<p>Each tile is a Stream Deck key at real size. Pick a design and a lens colour.</p>
<h2>warm lens</h2><div class="grid">
<div class="cell"><span class="tile"><img src="P3-plate-warm.png"><span class="ttl">HEAVE TO</span></span><div class="cap">P3-plate</div><div class="sub">plugin icon: no hood arc, gradient glow</div></div>
</div>
</body></html>
